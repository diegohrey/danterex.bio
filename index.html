<style>
:root{
  --bg:#f6f3ec; --surface:#fffdf8; --ink:#17211e; --muted:#5b6661; --line:#e2ddd1;
  --teal:#0f766e; --teal-soft:#d7ece8; --amber:#c2710c; --amber-soft:#f7e6cc;
  --shadow:0 1px 2px rgba(23,33,30,.06),0 8px 24px rgba(23,33,30,.06);
  --radius:16px; --maxw:1080px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1513; --surface:#161e1b; --ink:#e9efe9; --muted:#9aa7a1; --line:#26312d;
    --teal:#34b3a5; --teal-soft:#123a35; --amber:#f0a23b; --amber-soft:#3a2a12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --ink:#e9efe9; --muted:#9aa7a1; --line:#26312d;
  --teal:#34b3a5; --teal-soft:#123a35; --amber:#f0a23b; --amber-soft:#3a2a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Space Grotesk",Inter,system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--teal)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
section{padding:72px 0}
.eyebrow{font:600 12px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.lead{color:var(--muted);font-size:18px;max-width:640px}
h2{font-size:clamp(28px,4vw,38px);margin:10px 0 14px}

/* header */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 19px "Space Grotesk",sans-serif}
.brand svg{width:26px;height:26px;fill:var(--teal)}
nav.links{display:flex;gap:20px;margin-left:auto}
nav.links a{color:var(--muted);text-decoration:none;font-weight:500;font-size:15px}
nav.links a:hover{color:var(--ink)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.langs button{border:0;background:none;color:var(--muted);font:600 12px Inter,sans-serif;padding:6px 9px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--teal);color:#fff}
@media (max-width:820px){nav.links{display:none}.langs{margin-left:auto}}

/* hero */
.hero{padding:56px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(52px,9vw,96px);letter-spacing:-.02em;margin:14px 0 10px}
.hero h1 .rex{color:var(--teal)}
.tagline{font:600 clamp(20px,2.6vw,26px)/1.3 "Space Grotesk",sans-serif;margin:0 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;font-size:15px}
.btn.primary{background:var(--teal);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.helix-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;position:relative}
.helix-card svg{width:100%;height:100%}
.langs-strip{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;font:600 13px "Space Grotesk",sans-serif;color:var(--muted)}
.langs-strip b{color:var(--teal)}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.helix-card{aspect-ratio:16/11;max-height:360px}}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip.amber{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
@media (max-width:820px){.about-grid{grid-template-columns:1fr;gap:8px}}

/* pillars */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card .ico{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center;margin-bottom:14px}
.card .ico svg{width:22px;height:22px;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:19px;margin-bottom:6px}
.card p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.feature{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:linear-gradient(135deg,var(--amber-soft),var(--surface) 70%);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.feature .badge{width:84px;height:84px;border-radius:20px;background:var(--surface);display:grid;place-items:center;border:1px solid var(--line)}
.feature .badge svg{width:52px;height:52px;fill:var(--amber)}
.feature h3{font-size:24px;margin:6px 0}
.feature p{margin:0;color:var(--muted)}
@media (max-width:560px){.feature{grid-template-columns:1fr}}

/* glossary */
.gl-tools{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.search{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}
.gl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px}
.term-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.term h3{font-size:24px}
.year{font:600 12px Inter,sans-serif;color:var(--amber);background:var(--amber-soft);padding:4px 8px;border-radius:999px;white-space:nowrap}
.tr{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tr div{background:var(--bg);border-radius:10px;padding:7px 10px;min-width:0;display:flex;align-items:baseline;gap:8px}
.tr small{flex:none;font:600 10px Inter,sans-serif;letter-spacing:.08em;color:var(--muted)}
.tr span{font-weight:600;font-size:14px;overflow-wrap:break-word;min-width:0}
.tr div.cur{background:var(--teal-soft)}
.term p{margin:0;color:var(--muted);font-size:15px}
.empty{color:var(--muted);padding:20px 0}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
.svc{border-top:3px solid var(--teal);background:var(--surface);border-radius:0 0 var(--radius) var(--radius);padding:20px;box-shadow:var(--shadow)}
.svc.soon{border-top-color:var(--amber)}
.svc h3{font-size:19px;margin-bottom:6px}
.svc p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:980px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.svc-grid{grid-template-columns:1fr}}

/* road */
.road{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;position:relative}
.road::before{content:"";position:absolute;left:0;right:0;top:11px;height:2px;background:var(--line)}
.road li{position:relative;padding-top:34px}
.road li::before{content:"";position:absolute;top:4px;left:0;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--teal)}
.road li.goal::before{background:var(--amber);border-color:var(--amber)}
.road b{display:block;font:700 15px "Space Grotesk",sans-serif;color:var(--teal)}
.road li.goal b{color:var(--amber)}
.road span{font-size:15px}
@media (max-width:820px){.road{grid-template-columns:1fr;gap:0}.road::before{left:7px;right:auto;top:0;bottom:0;width:2px;height:auto}.road li{padding:0 0 22px 32px}.road li::before{top:4px}}

/* newsletter + contact */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.panel.news{background:var(--teal);color:#fff;border-color:transparent}
.panel.news .lead,.panel.news small{color:rgba(255,255,255,.85)}
.panel.news .eyebrow{color:#ffe2b3}
form.sub{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
form.sub input{flex:1;min-width:200px;border:0;border-radius:999px;padding:12px 16px;font:inherit}
form.sub button{border:0;border-radius:999px;padding:12px 20px;font:600 15px Inter,sans-serif;background:var(--amber);color:#fff;cursor:pointer}
.ok{margin-top:10px;font-weight:600;min-height:1.4em}
.social{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.social a{border:1px solid var(--line);border-radius:999px;padding:9px 14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.social a.off{opacity:.5;pointer-events:none}
.mail{font:600 20px "Space Grotesk",sans-serif;overflow-wrap:anywhere}
@media (max-width:820px){.split{grid-template-columns:1fr}}

footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>

/* ===== Lógica ===== */
const LANGS = ["es","en","de","pt"];
let lang = "es";
function pickLang(){
  const qp = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(qp)) return qp;
  try { const s = localStorage.getItem("dr-lang"); if (LANGS.includes(s)) return s; } catch(e){}
  const nav = (navigator.language||"es").slice(0,2).toLowerCase();
  return LANGS.includes(nav) ? nav : "es";
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function renderTerms(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const list = TERMS.filter(t => !q || norm(Object.values(t.t).join(" ")+" "+t.n[lang]).includes(norm(q)));
  const labels = {es:"ES",en:"EN",de:"DE",pt:"PT"};
  document.getElementById("terms").innerHTML = list.map(t => `
    <article class="term">
      <div class="term-head"><h3>${esc(t.t[lang])}</h3><span class="year">${esc(t.year)}</span></div>
      <div class="tr">${LANGS.map(l=>`<div class="${l===lang?"cur":""}"><small>${labels[l]}</small><span>${esc(t.t[l])}</span></div>`).join("")}</div>
      <p>${esc(t.n[lang])}</p>
    </article>`).join("");
  document.getElementById("empty").hidden = list.length > 0;
}
function renderSocial(){
  const d = I18N[lang];
  document.getElementById("social").innerHTML = Object.entries(CONFIG.social).map(([name,url]) =>
    url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${name}</a>` : `<a class="off" aria-disabled="true">${name} · ${d.soon}</a>`).join("");
}
function apply(l){
  lang = l; const d = I18N[l];
  document.documentElement.lang = l === "pt" ? "pt-BR" : l;
  document.querySelectorAll("[data-i18n]").forEach(el => { const k = el.dataset.i18n; if (d[k] !== undefined) el.textContent = d[k]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = d[el.dataset.i18nPh]; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  ["es","en","de","pt"].forEach(k => { const e = document.getElementById("acr-"+k); e.innerHTML = k===l ? `<b>${e.textContent}</b>` : e.textContent; });
  document.getElementById("subok").textContent = "";
  renderTerms(); renderSocial();
  try { localStorage.setItem("dr-lang", l); } catch(e){}
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => apply(b.dataset.lang)));
document.getElementById("q").addEventListener("input", renderTerms);

const mail = document.getElementById("mail");
mail.textContent = CONFIG.email; mail.href = "mailto:" + CONFIG.email;
document.getElementById("svc-mail").href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent("Dante Rex – tutorías / talleres");

document.getElementById("subform").addEventListener("submit", e => {
  e.preventDefault();
  const em = document.getElementById("subemail").value;
  if (CONFIG.newsletterEndpoint) {
    fetch(CONFIG.newsletterEndpoint, {method:"POST", body:new URLSearchParams({email:em})}).catch(()=>{});
  } else {
    location.href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent("Suscripción Ríos de ADN") + "&body=" + encodeURIComponent(em);
  }
  document.getElementById("subok").textContent = I18N[lang].news_ok;
  e.target.reset();
});

    svg.appendChild(l); rungs.push(l);
  }
  [pathA,pathB].forEach(p=>{p.setAttribute("fill","none");p.setAttribute("stroke-width","5");p.setAttribute("stroke-linecap","round");svg.appendChild(p);});
  for (let i=0;i<N;i++){
    const a = document.createElementNS(NS,"circle"), b = document.createElementNS(NS,"circle");
    svg.appendChild(a); svg.appendChild(b); dotsA.push(a); dotsB.push(b);
  }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function draw(t){
    const teal = css.getPropertyValue("--teal").trim(), amber = css.getPropertyValue("--amber").trim();
    let dA = "", dB = "";
    for (let i=0;i<N;i++){
      const ang = i*0.52 + t, y = top + i*step, s = Math.sin(ang), c = Math.cos(ang);
      const xa = cx + amp*s, xb = cx - amp*s;
      dA += (i?"L":"M") + xa.toFixed(1) + " " + y; dB += (i?"L":"M") + xb.toFixed(1) + " " + y;
      const r = rungs[i]; r.setAttribute("x1",xa); r.setAttribute("x2",xb); r.setAttribute("y1",y); r.setAttribute("y2",y);
      r.setAttribute("stroke", i%2 ? teal : amber); r.setAttribute("opacity", (0.25 + 0.35*Math.abs(s)).toFixed(2));
      dotsA[i].setAttribute("cx",xa); dotsA[i].setAttribute("cy",y); dotsA[i].setAttribute("r", (4.5 + 2.5*c).toFixed(1)); dotsA[i].setAttribute("fill", teal); dotsA[i].setAttribute("opacity",(0.55+0.45*c).toFixed(2));
      dotsB[i].setAttribute("cx",xb); dotsB[i].setAttribute("cy",y); dotsB[i].setAttribute("r", (4.5 - 2.5*c).toFixed(1)); dotsB[i].setAttribute("fill", amber); dotsB[i].setAttribute("opacity",(0.55-0.45*c).toFixed(2));
    }
    pathA.setAttribute("d",dA); pathB.setAttribute("d",dB);
    pathA.setAttribute("stroke",teal); pathB.setAttribute("stroke",amber);
    pathA.setAttribute("opacity",".35"); pathB.setAttribute("opacity",".35");
  }
  if (reduce) { draw(0.6); return; }
  const t0 = performance.now();
  (function loop(now){ draw((now - t0)/1400); requestAnimationFrame(loop); })(t0);
})();

apply(pickLang());
</script>
</body>
